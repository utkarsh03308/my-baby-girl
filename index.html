<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Nazrin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #000000;
    --white: #ffffff;
    --pink-soft: #f9d5e5;
    --pink-mid: #f3a0c3;
    --pink-deep: #e06c9f;
    --gold: #c9a97a;
    --cream: #fdf6f0;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--black);
    font-family: 'Cormorant Garamond', serif;
    cursor: default;
  }

  
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease;
    z-index: 1;
  }
  .screen.active { opacity: 1; pointer-events: all; }

  
  #particleCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  
  #petalCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
  }
  #petalCanvas.visible { opacity: 1; }

  
  #bgOverlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: var(--black);
    transition: background 3s ease, opacity 2s ease;
    pointer-events: none;
  }

  
  .glow-ambient {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: opacity 3s ease;
  }
  .glow-ambient.g1 {
    width: 60vw; height: 60vw;
    top: -20vw; left: -10vw;
    background: radial-gradient(circle, rgba(240,160,195,0.22), transparent 70%);
  }
  .glow-ambient.g2 {
    width: 50vw; height: 50vw;
    bottom: -15vw; right: -10vw;
    background: radial-gradient(circle, rgba(230,100,160,0.18), transparent 70%);
  }
  .glow-ambient.visible { opacity: 1; }

  
  #screen1 {
    background: transparent;
    gap: 0;
  }

  .s1-text {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    color: rgba(255,255,255,0);
    font-size: clamp(2.2rem, 6vw, 4rem);
    letter-spacing: 0.06em;
    text-align: center;
    transition: color 2s ease, opacity 2s ease;
    line-height: 1.4;
    padding: 0 1rem;
  }
  .s1-text.lit { color: rgba(255,255,255,0.92); }

  .s1-sub {
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    color: rgba(255,255,255,0);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-top: 1.6rem;
    text-align: center;
    transition: color 2.5s ease;
    padding: 0 1rem;
  }
  .s1-sub.lit { color: rgba(255,255,255,0.45); }

  #btnStart {
    margin-top: 4rem;
    padding: 0.85rem 2.8rem;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.75);
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: clamp(0.8rem, 2.2vw, 0.95rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0;
    transition: opacity 2s ease, border-color 0.4s ease, color 0.4s ease, background 0.4s ease;
    border-radius: 2px;
  }
  #btnStart.visible { opacity: 1; }
  #btnStart:hover {
    border-color: rgba(255,255,255,0.6);
    color: #fff;
    background: rgba(255,255,255,0.06);
  }

  
  #screen2 {
    background: transparent;
  }

  #emotionalLine {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.8rem, 5.5vw, 3.4rem);
    color: rgba(255,255,255,0.9);
    text-align: center;
    letter-spacing: 0.04em;
    line-height: 1.5;
    max-width: 680px;
    padding: 0 2rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1.4s ease, transform 1.4s ease;
  }
  #emotionalLine.show {
    opacity: 1;
    transform: translateY(0);
  }

  
  #screen3 {
    background: transparent;
    padding: 2rem;
  }

  .glass-card {
    max-width: 600px;
    width: 100%;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: clamp(2rem, 5vw, 3.5rem) clamp(1.8rem, 5vw, 3rem);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow:
      0 0 40px rgba(240,160,195,0.08),
      0 0 80px rgba(230,100,160,0.05),
      inset 0 0 0 1px rgba(255,255,255,0.07);
    animation: cardGlow 4s ease-in-out infinite alternate;
    position: relative;
    overflow: hidden;
  }

  @keyframes cardGlow {
    0%  { box-shadow: 0 0 40px rgba(240,160,195,0.08), 0 0 80px rgba(230,100,160,0.05), inset 0 0 0 1px rgba(255,255,255,0.07); }
    100%{ box-shadow: 0 0 60px rgba(240,160,195,0.14), 0 0 120px rgba(230,100,160,0.09), inset 0 0 0 1px rgba(255,255,255,0.13); }
  }

  .card-text {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(1rem, 2.6vw, 1.2rem);
    color: rgba(255,255,255,0.82);
    line-height: 2;
    letter-spacing: 0.02em;
    text-align: center;
    min-height: 4em;
  }

  .card-ending {
    font-style: italic;
    color: rgba(240,160,195,0.9);
    font-size: clamp(1.1rem, 2.8vw, 1.3rem);
    margin-top: 1.4rem;
    text-align: center;
    opacity: 0;
    transition: opacity 2s ease;
  }
  .card-ending.show { opacity: 1; }

  
  .cursor {
    display: inline-block;
    width: 1.5px;
    height: 1.1em;
    background: rgba(240,160,195,0.7);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 1.1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  
  #screen4 {
    background: transparent;
    gap: 0;
  }

  .final-line {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2rem, 6vw, 3.8rem);
    color: rgba(100,40,60,0);
    text-align: center;
    letter-spacing: 0.05em;
    line-height: 1.5;
    padding: 0 1.5rem;
    transition: color 2s ease, opacity 2s ease;
  }
  .final-line.lit { color: rgba(110,40,70,0.88); }

  .btn-row {
    display: flex;
    gap: 1.2rem;
    margin-top: 3.5rem;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    transition: opacity 2s ease;
  }
  .btn-row.visible { opacity: 1; }

  .btn-yes {
    padding: 1rem 2.8rem;
    border-radius: 60px;
    border: none;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    letter-spacing: 0.1em;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .btn-yes::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.15);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .btn-yes:hover::before { opacity: 1; }
  .btn-yes:hover { transform: translateY(-3px) scale(1.04); }

  .btn-yes.primary {
    background: linear-gradient(135deg, #e8869c, #d4567a);
    color: #fff;
    box-shadow: 0 6px 30px rgba(212,86,122,0.35);
  }
  .btn-yes.secondary {
    background: linear-gradient(135deg, #f3b8cc, #e896b0);
    color: #fff;
    box-shadow: 0 6px 30px rgba(232,150,176,0.35);
  }
  .btn-yes.primary:hover { box-shadow: 0 10px 40px rgba(212,86,122,0.5); }
  .btn-yes.secondary:hover { box-shadow: 0 10px 40px rgba(232,150,176,0.5); }

  
  #finalMessage {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(2rem, 7vw, 4rem);
    color: rgba(130,40,70,0);
    text-align: center;
    letter-spacing: 0.06em;
    padding: 0 1.5rem;
    opacity: 0;
    transform: scale(0.94);
    transition: color 2.5s ease, opacity 2.5s ease, transform 2.5s ease;
  }
  #finalMessage.show {
    opacity: 1;
    color: rgba(130,40,70,0.9);
    transform: scale(1);
  }

  
  .heart-particle {
    position: fixed;
    font-size: 1.4rem;
    pointer-events: none;
    z-index: 100;
    animation: heartFly 2s ease forwards;
    opacity: 1;
  }
  @keyframes heartFly {
    0%   { transform: translate(0,0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
  }

  
  #flashOverlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(255,200,220,0);
    pointer-events: none;
    transition: background 0.1s;
  }
  #flashOverlay.flash { background: rgba(255,200,220,0.35); }

  
  #musicHint {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    z-index: 200;
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    opacity: 0;
    transition: opacity 1.5s ease;
    cursor: pointer;
    user-select: none;
  }
  #musicHint.visible { opacity: 1; }
  #musicHint:hover { color: rgba(255,255,255,0.6); }

  
  #veil {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease;
  }
  #veil.dark { opacity: 1; pointer-events: all; }

  
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<div id="bgOverlay"></div>
<div class="glow-ambient g1"></div>
<div class="glow-ambient g2"></div>

<canvas id="particleCanvas"></canvas>

<canvas id="petalCanvas"></canvas>

<div id="veil"></div>

<div id="flashOverlay"></div>

<audio id="bgMusic" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="musicHint" onclick="toggleMusic()">♪ tap to unmute</div>

<div class="screen" id="screen1">
  <div class="s1-text" id="s1Line1">Nazrin…</div>
  <div class="s1-sub" id="s1Line2">I wanted to tell you something.</div>
  <button id="btnStart" onclick="goToScreen2()">yeah, go ahead.</button>
</div>

<div class="screen" id="screen2">
  <div id="emotionalLine"></div>
</div>

<div class="screen" id="screen3">
  <div class="glass-card">
    <div class="card-text" id="cardText"><span class="cursor"></span></div>
    <div class="card-ending" id="cardEnding">I love you endlessly.</div>
  </div>
</div>

<div class="screen" id="screen4">
  <div class="final-line" id="f1">So…</div>
  <div class="final-line" id="f2" style="margin-top:0.6rem;">Will you stay beside me…</div>
  <div class="final-line" id="f3" style="margin-top:0.4rem;">through every chapter of life?</div>

  <div class="btn-row" id="btnRow">
    <button class="btn-yes primary"  onclick="handleYes()">Yes.</button>
    <button class="btn-yes secondary" onclick="handleYes()">Forever yes.</button>
  </div>

  <div id="finalMessage">You made my life beautiful.</div>
</div>

<script>

const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);

const music = $('bgMusic');
let musicStarted = false;
let muted = false;
music.volume = 0;

function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  music.play().then(() => {
    fadeVolume(0, 0.22, 5000);
    $('musicHint').classList.add('visible');
    $('musicHint').textContent = '♪ tap to mute';
  }).catch(() => {
    $('musicHint').classList.add('visible');
    $('musicHint').textContent = '♪ tap to play';
  });
}

function toggleMusic() {
  if (!musicStarted) { startMusic(); return; }
  if (muted) {
    muted = false;
    fadeVolume(0, currentTargetVol, 1500);
    $('musicHint').textContent = '♪ tap to mute';
  } else {
    muted = true;
    fadeVolume(music.volume, 0, 1500);
    $('musicHint').textContent = '♪ tap to unmute';
  }
}

let currentTargetVol = 0.22;
function fadeVolume(from, to, duration) {
  currentTargetVol = to;
  const steps = 60;
  const dt = duration / steps;
  const dv = (to - from) / steps;
  let v = from;
  const timer = setInterval(() => {
    v += dv;
    music.volume = Math.max(0, Math.min(1, v));
    if (Math.abs(music.volume - to) < 0.005) { music.volume = to; clearInterval(timer); }
  }, dt);
}

const pCanvas = $('particleCanvas');
const pCtx = pCanvas.getContext('2d');
const petalCanvas = $('petalCanvas');
const petalCtx = petalCanvas.getContext('2d');

let particles = [];
let pinkMode = false;

function resizeCanvas() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
  petalCanvas.width = window.innerWidth;
  petalCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function createParticle() {
  return {
    x: Math.random() * pCanvas.width,
    y: Math.random() * pCanvas.height,
    r: Math.random() * 1.4 + 0.3,
    dx: (Math.random() - 0.5) * 0.18,
    dy: -Math.random() * 0.22 - 0.05,
    alpha: Math.random() * 0.5 + 0.1,
    dAlpha: (Math.random() - 0.5) * 0.002,
  };
}

for (let i = 0; i < 90; i++) particles.push(createParticle());

function animateParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particles.forEach((p, i) => {
    p.x += p.dx; p.y += p.dy;
    p.alpha += p.dAlpha;
    if (p.alpha < 0.05) p.dAlpha = Math.abs(p.dAlpha);
    if (p.alpha > 0.7)  p.dAlpha = -Math.abs(p.dAlpha);
    if (p.y < -5) { particles[i] = createParticle(); particles[i].y = pCanvas.height + 5; }

    const color = pinkMode
      ? `rgba(240,150,190,${p.alpha})`
      : `rgba(255,255,255,${p.alpha * 0.6})`;

    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pCtx.fillStyle = color;
    pCtx.fill();

    if (pinkMode) {
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
      pCtx.fillStyle = `rgba(240,120,170,${p.alpha * 0.08})`;
      pCtx.fill();
    }
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

let petals = [];

function createPetal() {
  return {
    x: Math.random() * petalCanvas.width,
    y: -20 - Math.random() * 100,
    size: Math.random() * 10 + 6,
    rotation: Math.random() * Math.PI * 2,
    dRot: (Math.random() - 0.5) * 0.04,
    dx: (Math.random() - 0.5) * 0.8,
    dy: Math.random() * 1.2 + 0.6,
    alpha: Math.random() * 0.5 + 0.3,
    hue: Math.random() * 30 + 330,
  };
}

for (let i = 0; i < 60; i++) {
  const p = createPetal();
  p.y = Math.random() * petalCanvas.height;
  petals.push(p);
}

let petalsActive = false;

function drawPetal(ctx, p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rotation);
  ctx.globalAlpha = p.alpha;
  ctx.beginPath();
  ctx.ellipse(0, 0, p.size * 0.5, p.size, 0, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size);
  grad.addColorStop(0, `hsla(${p.hue}, 80%, 88%, 1)`);
  grad.addColorStop(1, `hsla(${p.hue + 20}, 70%, 78%, 0.3)`);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();
}

function animatePetals() {
  petalCtx.clearRect(0, 0, petalCanvas.width, petalCanvas.height);
  if (petalsActive) {
    petals.forEach((p, i) => {
      p.x += p.dx + Math.sin(Date.now() * 0.0008 + i) * 0.3;
      p.y += p.dy;
      p.rotation += p.dRot;
      if (p.y > petalCanvas.height + 20) {
        petals[i] = createPetal();
      }
      drawPetal(petalCtx, p);
    });
  }
  requestAnimationFrame(animatePetals);
}
animatePetals();

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active');
  });
  $(id).classList.add('active');
}

async function fadeVeil(to, duration = 1400) {
  const veil = $('veil');
  if (to) {
    veil.classList.add('dark');
  } else {
    await sleep(100);
    veil.classList.remove('dark');
  }
  await sleep(duration);
}

async function initScreen1() {
  showScreen('screen1');
  await sleep(1200);
  $('s1Line1').classList.add('lit');
  await sleep(1800);
  $('s1Line2').classList.add('lit');
  await sleep(2000);
  $('btnStart').classList.add('visible');
}

const emotionalLines = [
  "Distance hurts, doesn't it?",
  "But even from far away…",
  "You still make my world feel warm.",
  "And no matter how hard life gets…",
  "I still choose you."
];

async function goToScreen2() {
  $('btnStart').style.pointerEvents = 'none';
  await fadeVeil(true, 1200);
  startMusic();
  showScreen('screen2');
  await fadeVeil(false, 1400);

  for (const line of emotionalLines) {
    const el = $('emotionalLine');
    el.textContent = line;
    el.classList.remove('show');
    await sleep(200);
    el.classList.add('show');
    await sleep(3600);
    el.classList.remove('show');
    await sleep(1200);
  }
  await goToScreen3();
}

const cardFullText = `Babe… I know you've been suffering silently, and I hate that I can't always be there beside you. The distance between us makes everything harder, but even then, my love for you never changes.\n\nI'm trying my best to study hard and go abroad someday… just so I can finally meet you and hold you close.\n\nI know I'm not perfect. Sometimes I feel boring, sometimes I feel like I hurt you without meaning to… and for that, I'm genuinely sorry.\n\nBut even with all my flaws… I just want one thing:\n\nyour happiness.`;

async function goToScreen3() {
  await fadeVeil(true, 1200);
  showScreen('screen3');
  await fadeVeil(false, 1400);
  await sleep(800);

  const el = $('cardText');
  el.innerHTML = '<span class="cursor"></span>';
  let i = 0;
  const chars = cardFullText.split('');

  await new Promise(resolve => {
    function typeNext() {
      if (i >= chars.length) { resolve(); return; }
      const ch = chars[i++];
      const cursor = el.querySelector('.cursor');
      if (ch === '\n') {
        cursor.insertAdjacentHTML('beforebegin', '<br>');
      } else {
        cursor.insertAdjacentText('beforebegin', ch);
      }
      el.scrollTop = el.scrollHeight;
      const delay = ch === '.' || ch === '…' ? 260 : ch === ',' ? 140 : 36;
      setTimeout(typeNext, delay);
    }
    typeNext();
  });

  await sleep(800);
  const cursor = el.querySelector('.cursor');
  if (cursor) cursor.remove();
  $('cardEnding').classList.add('show');
  await sleep(4500);
  await goToScreen4();
}

async function goToScreen4() {
  await fadeVeil(true, 1600);

  
  pinkMode = true;
  document.getElementById('bgOverlay').style.background =
    'linear-gradient(160deg, #fce4ec 0%, #f9d0e0 40%, #ffd6e7 70%, #ffe0ea 100%)';
  document.querySelectorAll('.glow-ambient').forEach(g => g.classList.add('visible'));
  $('petalCanvas').classList.add('visible');
  petalsActive = true;
  $('musicHint').style.color = 'rgba(140,60,80,0.4)';

  if (musicStarted && !muted) fadeVolume(music.volume, 0.38, 3000);

  showScreen('screen4');
  await fadeVeil(false, 2000);

  
  await sleep(800);
  $('f1').classList.add('lit');
  await sleep(2000);
  $('f2').classList.add('lit');
  await sleep(2000);
  $('f3').classList.add('lit');
  await sleep(2200);
  $('btnRow').classList.add('visible');
}

let yesDone = false;
async function handleYes() {
  if (yesDone) return;
  yesDone = true;

  
  $('btnRow').style.opacity = '0';
  $('f1').classList.remove('lit');
  $('f2').classList.remove('lit');
  $('f3').classList.remove('lit');

  
  burstHearts();
  flashScreen();

  if (musicStarted && !muted) fadeVolume(music.volume, 0.55, 2000);

  await sleep(1400);
  const fm = $('finalMessage');
  fm.classList.add('show');

  
  let tapCount = 0;
  let tapTimer = null;
  function onFinalTap() {
    tapCount++;
    clearTimeout(tapTimer);
    if (tapCount >= 3) {
      tapCount = 0;
      restartEverything();
      return;
    }
    tapTimer = setTimeout(() => { tapCount = 0; }, 700);
  }
  fm.style.cursor = 'pointer';
  fm.addEventListener('click', onFinalTap);
  fm.addEventListener('touchend', e => { e.preventDefault(); onFinalTap(); });
}

async function restartEverything() {
  
  const veil = $('veil');
  veil.classList.add('dark');
  await sleep(1600);

  
  pinkMode = false;
  petalsActive = false;
  $('petalCanvas').classList.remove('visible');
  $('bgOverlay').style.background = '#000000';
  document.querySelectorAll('.glow-ambient').forEach(g => g.classList.remove('visible'));
  $('musicHint').style.color = '';

  
  yesDone = false;
  $('f1').classList.remove('lit');
  $('f2').classList.remove('lit');
  $('f3').classList.remove('lit');
  $('btnRow').style.opacity = '0';
  $('btnRow').classList.remove('visible');
  const fm = $('finalMessage');
  fm.classList.remove('show');
  fm.style.cursor = '';

  
  $('cardText').innerHTML = '<span class="cursor"></span>';
  $('cardEnding').classList.remove('show');

  
  const el = $('emotionalLine');
  el.classList.remove('show');
  el.textContent = '';

  
  $('s1Line1').classList.remove('lit');
  $('s1Line2').classList.remove('lit');
  $('btnStart').classList.remove('visible');
  $('btnStart').style.pointerEvents = '';

  
  if (musicStarted && !muted) fadeVolume(music.volume, 0, 1500);
  musicStarted = false;

  
  for (let i = 0; i < petals.length; i++) {
    petals[i] = createPetal();
    petals[i].y = Math.random() * petalCanvas.height;
  }

  await sleep(400);
  veil.classList.remove('dark');
  await sleep(1600);

  
  await initScreen1();
}

function burstHearts() {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const emojis = ['❤️','🌸','💕','✨','💖','🌷'];
  for (let i = 0; i < 28; i++) {
    const el = document.createElement('div');
    el.className = 'heart-particle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 200;
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    el.style.animationDelay = (Math.random() * 0.4) + 's';
    el.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }
}

function flashScreen() {
  const f = $('flashOverlay');
  f.classList.add('flash');
  setTimeout(() => f.classList.remove('flash'), 350);
}

initScreen1();
</script>
